name: udo_mobile
description: "Udo — Wedding Planning & Coordination"
publish_to: 'none'
version: 1.0.0+7

environment:
  # Upper bound is deliberate: Dart >= 3.13 introduces dot-shorthand syntax that
  # the pinned analyzer/riverpod_generator/custom_lint can't parse, which crashes
  # `dart run build_runner build` ("Missing implementation of
  # visitDotShorthandPropertyAccess"). Build with Flutter 3.38.x (Dart 3.10.x) —
  # see .fvmrc and docs/APP_STORE_SUBMISSION.md. Lift the cap only when the whole
  # codegen stack is bumped together.
  sdk: ">=3.0.0 <3.13.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.3.0

  # Network
  dio: ^5.7.0
  # Pin below 4.6.0: retrofit >=4.6 adds Parser.DartMappable, which the 9.x
  # retrofit_generator (the newest that supports our Flutter/Dart) can't match,
  # breaking `dart run build_runner build`. retrofit_generator 10.x needs Dart
  # >=3.11. Revisit both together on a Flutter bump.
  retrofit: ">=4.4.1 <4.6.0"

  # Storage / Auth
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Social sign-in
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4

  # Native in-app purchase (StoreKit / Google Play Billing)
  in_app_purchase: ^3.2.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  shimmer: ^3.0.0
  lottie: ^3.1.3
  video_player: ^2.9.2
  just_audio: ^0.9.40

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.0.3
  package_info_plus: ^8.1.2

  # Real-time
  pusher_channels_flutter: ^2.1.0

  # Forms / validation
  formz: ^0.7.0
  pdf: ^3.12.0
  printing: ^5.14.3
  file_picker: ^11.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  qr_flutter: ^4.1.0
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  retrofit_generator: ">=9.1.7 <10.0.0"
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/branding/

# Regenerate after changing assets/branding/*: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# Regenerate after changing assets/branding/*: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F8F8F5"
  image: assets/branding/splash_image.png
  # Android 12+'s native SplashScreen API renders this inside a fixed
  # square icon window (like an adaptive icon) — it must be the square
  # mark-only asset, not the tall full lockup with wordmark/tagline text,
  # or it gets center-cropped down to near-nothing.
  android_12:
    color: "#F8F8F5"
    image: assets/branding/app_icon_foreground.png
  android: true
  ios: true
