name: udo_mobile
description: "Udo — Wedding Planning & Coordination"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.3.0

  # Network
  dio: ^5.7.0
  retrofit: ^4.4.1

  # Storage / Auth
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Social sign-in
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  shimmer: ^3.0.0
  lottie: ^3.1.3

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.0.3
  package_info_plus: ^8.1.2
  permission_handler: ^11.3.1

  # Real-time
  pusher_channels_flutter: ^2.1.0

  # Forms / validation
  formz: ^0.7.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  retrofit_generator: ^9.1.7
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
