# Codemagic CI for the Udo iOS app.
# The Flutter app lives in apps/mobile (monorepo), so every step runs there.
workflows:
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile

    integrations:
      # Must match the name of the App Store Connect API key added in
      # Codemagic → Team settings → Integrations → Developer Portal.
      app_store_connect: Udo ASC

    environment:
      # Pinned on purpose: pubspec caps Dart < 3.13 (see its environment
      # comment); Flutter 3.38.x ships Dart 3.10.
      flutter: 3.38.7
      xcode: latest
      cocoapods: default
      # Provides the "Certificate" private key (Codemagic → app → Environment
      # variables → group "ios_signing"). Used to find/create the Apple
      # Distribution certificate, so no Mac or manual profile is needed.
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: com.udowedding.udoMobile

    # No automatic trigger: this repo also holds the API and web app, so
    # start iOS builds manually from Codemagic (Start new build → master).

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: cd ios && pod install --repo-update

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch or create signing certificate and App Store profile
        # Uses the Udo ASC integration for Apple API access. --create makes
        # the certificate/profile when missing (or when the App ID's
        # capabilities, e.g. Sign in with Apple, changed).
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:Certificate \
            --delete-stale-profiles \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply code signing profiles
        script: xcode-project use-profiles

      - name: Build IPA
        # Version name (1.0.0) comes from pubspec; the build number is
        # Codemagic's per-app counter, so every upload is strictly higher.
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
